name: Release

on:
  push:
    tags: ['v*']

# GitHub-hosted runners only — see the note in ci.yml.
permissions:
  contents: write # create the GitHub Release object, not just the tag
  id-token: write # npm trusted publishing (OIDC); no long-lived npm token is stored

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # protected environment, requires a reviewer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Do not set registry-url. That option writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` with an empty token,
          # and npm then never starts the OIDC exchange — publish fails with a
          # misleading 404. Trusted publishing needs a clean npmrc.

      - name: Use an npm that speaks OIDC trusted publishing
        run: npm install -g npm@11.6.2

      - run: npm ci

      - name: Verify before publishing
        run: npm run verify

      - name: Check the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        # Skip rather than fail when the version is already on the registry. The first
        # release was published by hand to claim the name, so without this a tag push
        # for that same version turns the whole release red for no real reason.
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "lipdub-mcp@${version}" version >/dev/null 2>&1; then
            echo "::notice::lipdub-mcp@${version} is already published; skipping."
            exit 0
          fi
          npm publish --access public

      - name: Create the GitHub Release
        # A tag alone is not a release: without this, the version is invisible on the
        # releases page and release notes never get written.
        #
        # Skip rather than fail when the release already exists, for the same reason as
        # the npm step above: a re-run after a partial failure, or a release drafted by
        # hand, otherwise fails here with HTTP 422 and skips the registry job with it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::GitHub Release ${GITHUB_REF_NAME} already exists; skipping."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --verify-tag

  registry:
    # Publishes the server.json entry to the official MCP registry so the server is
    # discoverable rather than only installable.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install the registry publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate against the ai.lipdub namespace
        # DNS verification against a TXT record on lipdub.ai. The signing key is held
        # as a secret; the domain proves first-party ownership in a way the
        # io.github.* namespace cannot.
        #
        # Registry listing is discovery, not distribution: npm is what makes the server
        # installable. So when the namespace is not yet set up, say so and stop rather
        # than failing a release that otherwise succeeded.
        id: auth
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "${MCP_PRIVATE_KEY}" ]; then
            echo "::warning::MCP_REGISTRY_PRIVATE_KEY is not set; skipping MCP registry listing."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          ./mcp-publisher login dns --domain lipdub.ai --private-key "${MCP_PRIVATE_KEY}"
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Skip when this version is already listed
        # Same idempotency as the npm and GitHub Release steps: a re-run must not fail
        # because an earlier attempt already got this far.
        id: listing
        if: steps.auth.outputs.ready == 'true'
        run: |
          server_name="$(node -p "require('./server.json').name")"
          server_version="$(node -p "require('./server.json').version")"
          encoded_server_name="$(node -p "encodeURIComponent(process.argv[1])" "${server_name}")"
          listing_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_server_name}/versions/${server_version}")"
          case "${listing_status}" in
            200)
              echo "::notice::${server_name}@${server_version} is already listed; skipping."
              echo "needed=false" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "needed=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Registry lookup for ${server_name}@${server_version} returned HTTP ${listing_status}."
              exit 1
              ;;
          esac

      - name: Wait until npm serves this version
        # The registry proves ownership by fetching this version's package.json from
        # npm and comparing its mcpName. npm can take minutes to serve a fresh publish,
        # and publishing to the registry before then fails the listing.
        if: steps.listing.outputs.needed == 'true'
        run: |
          server_name="$(node -p "require('./server.json').name")"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          maximum_attempts=30
          seconds_between_attempts=10
          for attempt in $(seq 1 "${maximum_attempts}"); do
            published_mcp_name="$(npm view "${package_name}@${package_version}" mcpName 2>/dev/null || true)"
            if [ "${published_mcp_name}" = "${server_name}" ]; then
              exit 0
            fi
            echo "Attempt ${attempt}/${maximum_attempts}: npm does not serve ${package_name}@${package_version} with mcpName yet."
            sleep "${seconds_between_attempts}"
          done
          echo "::error::npm never served ${package_name}@${package_version} with mcpName ${server_name}."
          exit 1

      - name: Publish
        if: steps.listing.outputs.needed == 'true'
        run: ./mcp-publisher publish
